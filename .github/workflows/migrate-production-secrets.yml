name: Migrate production environment secrets
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  encrypt:
    if: github.repository == 'palpen/hacker-times-public' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: cloudflare-staging
    steps:
      - name: Install encryption library before accessing secrets
        run: python3 -m pip install --disable-pip-version-check --no-input PyNaCl==1.5.0
      - name: Encrypt existing values for this repository's production environment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MONITOR_ALERT_TO: ${{ secrets.MONITOR_ALERT_TO }}
        run: |
          python3 - <<'PYTHON'
          import base64, json, os
          from nacl.public import PublicKey, SealedBox
          box = SealedBox(PublicKey(base64.b64decode('OQOf17APLCtLy2PVUu5/Zkhq6USTIb85jgU8SGaI9C8=')))
          result = {}
          for name in ['CLOUDFLARE_API_TOKEN', 'MONITOR_ALERT_TO']:
              value = os.environ.get(name, '')
              if not value:
                  raise SystemExit('Missing required source secret: ' + name)
              result[name] = {'key_id': '3380204578043523366', 'encrypted_value': base64.b64encode(box.encrypt(value.encode())).decode()}
          with open('production-secrets.encrypted.json', 'w') as f:
              json.dump(result, f)
          PYTHON
      - name: Save only GitHub-encrypted values for installation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-secrets-encrypted
          path: production-secrets.encrypted.json
          retention-days: 1
          if-no-files-found: error
